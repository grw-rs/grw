[package]
name = "grw"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Graph construction, mutation, and morphism matching"
repository = "https://github.com/grw-rs/grw"
keywords = ["graph", "isomorphism", "morphism", "pattern-matching"]
categories = ["algorithms", "data-structures"]
include = ["src/**/*", "LICENSE-*", "README.md"]

[[example]]
name = "graph_perf"
path = "examples/graph_perf.rs"

[features]
default = ["id32"]
id32 = []
id64 = []
parity = ["dep:rand"]

[dev-dependencies]
trybuild = "1"
rand = "0.9"
petgraph = "0.7"

[dependencies]
rand = { version = "0.9", optional = true }
range-collections = "0.4.6"
derive_more = { version = "2.0.1", features = ["debug", "deref", "deref_mut"] }
itertools = "0.14.0"
range-set-blaze = "0.3.0"
roaring = { version = "0.10.12", features = ["serde"] }
rustc-hash = "2.1.1"
slotmap = { version = "1.1.1", features = ["serde"] }
smallvec = { version = "1.15.0", features = ["serde"] }
indexmap = { version = "2.10.0", features = ["serde"] }
rayon = "1.10.0"
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
bincode = "1"
memmap2 = "0.9"
grw_derive = "0.1"
ordered-float = "5.3.0"

